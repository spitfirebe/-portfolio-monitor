name: Portfolio Monitor — Slotkoersen

on:
  schedule:
    # Elke werkdag 21:15 UTC = 22:15 CET (na sluiting NYSE/NASDAQ)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # handmatig triggeren via GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Portfolio monitor uitvoeren
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: python agents/cloud_monitor.py
