name: Portfolio Monitor — Slotkoersen

on:
  schedule:
    # Elke werkdag 21:15 UTC = 22:15 CET (na sluiting NYSE/NASDAQ)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # handmatig triggeren via GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Python instellen
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.12'

      - name: Debug info
        run: |
          python --version
          pwd
          ls -la agents/ | head -20

      - name: Portfolio monitor uitvoeren
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: python agents/cloud_monitor.py 2>&1
